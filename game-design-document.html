<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Design Document: Pirate Blast — Buğracan Bozkurt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@300;400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #060B13;
  --bg-2:      #0A121F;
  --bg-3:      #111C2E;
  --line:      rgba(241,245,249,0.10);
  --line-2:    rgba(241,245,249,0.18);
  --fg:        #F8FAFC;
  --fg-dim:    #94A3B8;
  --fg-faint:  #475569;
  --accent:    #38BDF8;
  --accent-2:  #7DD3FC;
  --accent-glow: rgba(56, 189, 248, 0.35);

  --serif:  'Cormorant Garamond', 'Times New Roman', serif;
  --sans:   'Space Grotesk', system-ui, sans-serif;
  --mono:   'JetBrains Mono', ui-monospace, monospace;

  --pad-x:  clamp(20px, 5vw, 80px);
  --rule:   1px solid var(--line);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; 
  overflow: hidden; /* Prevent double scrollbars */
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }

.nav {
  flex-shrink: 0;
  height: 72px; padding: 0 var(--pad-x);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid transparent;
  z-index: 100;
  background: var(--bg-2);
  border-bottom: var(--rule);
}

.nav__brand {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em;
  color: var(--fg); text-transform: uppercase;
}

.nav__dot {
  width: 6px; height: 6px; background: var(--accent);
  border-radius: 50%; box-shadow: 0 0 8px var(--accent-glow);
}

.btn-back {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em;
  color: var(--fg-dim); text-transform: uppercase;
  transition: color .2s ease;
}

.btn-back:hover { color: var(--accent); }

.pdf-container {
  flex-grow: 1;
  width: 100%;
  padding: 20px var(--pad-x);
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

.pdf-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.pdf-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  color: var(--fg);
}

.iframe-wrapper {
  flex-grow: 1;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line-2);
  background: #fff; /* PDFs usually need white bg */
}

.iframe-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

</style>
</head>
<body>

<header class="nav">
  <a href="index.html#blog" class="nav__brand">
    <span class="nav__dot"></span>
    <span class="nav__name">BUĞRACAN BOZKURT</span>
  </a>
  <a href="index.html#blog" class="btn-back">← Back to Portfolio</a>
</header>

<main class="pdf-container">
  <div class="pdf-header">
    <h1 class="pdf-title">Game Design Document: Pirate Blast</h1>
    <span style="font-family: var(--mono); font-size: 11px; color: var(--fg-faint); letter-spacing: 0.1em; text-transform: uppercase;">Secure PDF Viewer</span>
  </div>
  <div class="iframe-wrapper">
    <iframe src="Game_Design_Document.pdf#toolbar=0" title="Game Design Document"></iframe>
  </div>
</main>

</body>
</html>
